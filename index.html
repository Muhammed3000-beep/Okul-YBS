<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBS - Okul Yönetim Sistemi</title>
    <style>
        body { font-family: sans-serif; background: #e0f7fa; margin: 0; padding: 10px; color: #333; }
        .container { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
        h2 { color: #00796b; font-size: 1.2rem; margin-top: 0; border-bottom: 2px solid #b2dfdb; padding-bottom: 5px;}
        h3 { color: #004d40; font-size: 1rem; margin-bottom: 5px;}
        input, select { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #b2dfdb; border-radius: 5px; box-sizing: border-box; background: #f1f8e9;}
        button { width: 100%; padding: 12px; background: #00796b; color: white; border: none; border-radius: 5px; font-weight: bold; margin-top: 5px; cursor: pointer;}
        .btn-red { background: #d32f2f; }
        .btn-blue { background: #1976d2; }
        .hidden { display: none; }
        .flex-row { display: flex; gap: 5px; }
        .student-row { display: flex; justify-content: space-between; align-items: center; background: #e8f5e9; padding: 8px; margin-bottom: 5px; border-radius: 5px;}
        .student-row input { width: 80px; margin: 0; padding: 5px; text-align: center;}
        .info-box { background: #e3f2fd; padding: 10px; border-radius: 5px; margin-top: 5px; font-size: 0.9rem; border-left: 5px solid #1976d2; }
        hr { border: 1px solid #eee; margin: 15px 0; }
        .live-badge { background: #d50000; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; vertical-align: top; margin-left: 5px; animation: blink 1.5s infinite;}
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
    </style>
</head>
<body>

<div id="main-menu" class="container">
    <h2>🌟 Sistem Girişi</h2>
    <button class="btn-blue" onclick="show('ybs-login')">⚙️ YBS Girişi</button>
    <button class="btn-blue" onclick="show('teacher-login')">👨‍🏫 Öğretmen Girişi</button>
    <button class="btn-blue" onclick="show('vbs-login')">👨‍👩‍👧 VBS Girişi</button>
</div>

<div id="ybs-login" class="container hidden">
    <h2>⚙️ YBS Giriş</h2>
    <input type="number" id="ybs-kurum" placeholder="Kurum Kodu">
    <input type="number" id="ybs-kod" placeholder="Kullanıcı Kodu">
    <input type="password" id="ybs-pass" placeholder="Şifre">
    <button onclick="loginYBS()">Giriş Yap ✔️</button>
    <button class="btn-red" onclick="show('main-menu')">Geri 🔙</button>
</div>

<div id="ybs-panel" class="container hidden">
    <h2>🛠️ YBS Yönetim Paneli</h2>
    <button class="btn-red" onclick="logoutYBS()">Çıkış Yap 🚪</button>
    <hr>
    <h3>🎓 Öğrenci Yönetimi</h3>
    <select id="ybs-s-class"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select>
    <select id="ybs-s-branch"><option value="Gep-Up 1">Gep-Up 1</option><option value="Gep-Up 2">Gep-Up 2</option><option value="Gep-Up 3">Gep-Up 3</option></select>
    <input type="text" id="ybs-s-name" placeholder="Adı Soyadı">
    <input type="number" id="ybs-s-no" placeholder="Numara">
    <input type="text" id="ybs-s-pin" placeholder="Özel Kod">
    <button onclick="addStudent()">Öğrenci Kaydet 💾</button>
</div>

<div id="teacher-login" class="container hidden">
    <h2>👨‍🏫 Öğretmen Girişi</h2>
    <input type="text" id="teacher-user" placeholder="Kullanıcı Adı">
    <input type="password" id="teacher-pass" placeholder="Şifre">
    <button onclick="loginTeacher()">Giriş Yap ✔️</button>
    <button class="btn-red" onclick="show('main-menu')">Geri 🔙</button>
</div>

<div id="teacher-panel" class="container hidden">
    <h2>📝 Not Giriş Paneli</h2>
    <select id="t-class" onchange="filterStudents()"><option disabled selected value="">Sınıf Seç</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select>
    <select id="t-branch" onchange="filterStudents()"><option disabled selected value="">Şube Seç</option><option value="Gep-Up 1">Gep-Up 1</option><option value="Gep-Up 2">Gep-Up 2</option><option value="Gep-Up 3">Gep-Up 3</option></select>
    <select id="t-lesson" onchange="filterStudents()"><option disabled selected value="">Ders Seç</option><option value="Matematik">Matematik</option><option value="Türkçe">Türkçe</option><option value="İngilizce">İngilizce</option></select>
    <select id="t-term" onchange="filterStudents()"><option disabled selected value="">Dönem</option><option value="1. Dönem">1. Dönem</option><option value="2. Dönem">2. Dönem</option></select>
    <select id="t-type" onchange="filterStudents()"><option disabled selected value="">Not Tipi</option><option value="Sınav">Sınav</option><option value="Ders İçi Katılım">Ders İçi Katılım</option><option value="Proje">Proje</option></select>
    
    <div id="teacher-student-list" style="margin-top:10px;"></div>
    <button onclick="saveGrades()">Tümünü Kaydet/Güncelle 💾</button>
    <button class="btn-red" onclick="logoutTeacher()">Güvenli Çıkış ❌</button>
</div>

<div id="vbs-login" class="container hidden">
    <h2>👨‍👩‍👧 VBS Girişi</h2>
    <input type="number" id="vbs-no" placeholder="Okul No">
    <input type="password" id="vbs-kod" placeholder="Özel Kod">
    <button onclick="loginVBS()">Giriş ✔️</button>
    <button class="btn-red" onclick="show('main-menu')">Geri 🔙</button>
</div>

<div id="vbs-panel" class="container hidden">
    <h2>📊 Veli Bilgilendirme <span class="live-badge">CANLI</span></h2>
    <div id="vbs-student-name" style="font-weight:bold; color:#004d40; margin-bottom:10px;"></div>
    <h3>📝 Not Bilgileri</h3>
    <div id="vbs-grades" style="background: #e3f2fd; padding: 10px; border-radius: 5px; white-space: pre-line;">Yükleniyor...</div>
    <button class="btn-red" style="margin-top:15px;" onclick="logoutVBS()">Güvenli Çıkış 🚪</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyASb6aRHntgSacKMKCZ_kMxv2j78RLotiw",
      databaseURL: "https://my-e-kurs-project-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "my-e-kurs-project"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    let vbsListener = null;

    // --- YARDIMCI ---
    window.show = (id) => { document.querySelectorAll('.container').forEach(e => e.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); };

    // --- YBS İŞLEMLERİ ---
    window.loginYBS = () => { 
        if(document.getElementById('ybs-kurum').value == '76') {
            window.show('ybs-panel'); 
        } else {
            alert("Hatalı Giriş!"); 
        }
    };

    window.logoutYBS = () => {
        // YBS giriş bilgilerini ve formu temizle
        document.getElementById('ybs-kurum').value = '';
        document.getElementById('ybs-kod').value = '';
        document.getElementById('ybs-pass').value = '';
        document.getElementById('ybs-s-name').value = '';
        document.getElementById('ybs-s-no').value = '';
        document.getElementById('ybs-s-pin').value = '';
        window.show('main-menu');
    };

    window.addStudent = () => {
        const no = document.getElementById('ybs-s-no').value;
        set(ref(db, 'ogrenciler/' + no), {
            sinif: document.getElementById('ybs-s-class').value,
            sube: document.getElementById('ybs-s-branch').value,
            isim: document.getElementById('ybs-s-name').value,
            no: no,
            kod: document.getElementById('ybs-s-pin').value
        }).then(() => {
            alert("Öğrenci Kaydedildi");
            document.getElementById('ybs-s-name').value = '';
            document.getElementById('ybs-s-no').value = '';
            document.getElementById('ybs-s-pin').value = '';
        });
    };

    // --- ÖĞRETMEN İŞLEMLERİ ---
    window.loginTeacher = () => {
        const user = document.getElementById('teacher-user').value;
        get(child(ref(db), `ogretmenler/${user}`)).then(s => {
            if(s.exists()) window.show('teacher-panel');
            else alert("Hatalı Kullanıcı Adı veya Şifre!");
        });
    };

    window.logoutTeacher = () => {
        // Öğretmen giriş bilgilerini ve not formunu temizle
        document.getElementById('teacher-user').value = '';
        document.getElementById('teacher-pass').value = '';
        document.getElementById('teacher-student-list').innerHTML = '';
        
        // Seçim kutularını (Dropdown) başa döndür
        document.getElementById('t-class').selectedIndex = 0;
        document.getElementById('t-branch').selectedIndex = 0;
        document.getElementById('t-lesson').selectedIndex = 0;
        document.getElementById('t-term').selectedIndex = 0;
        document.getElementById('t-type').selectedIndex = 0;
        
        window.show('main-menu');
    };

    window.filterStudents = async () => {
        const cl = document.getElementById('t-class').value;
        const br = document.getElementById('t-branch').value;
        const le = document.getElementById('t-lesson').value;
        const te = document.getElementById('t-term').value;
        const ty = document.getElementById('t-type').value;

        if(!cl || !br || !le || !te || !ty) return;

        const uniqueKey = `${le}_${te}_${ty}`.replace(/ /g, '_');
        const listDiv = document.getElementById('teacher-student-list');
        listDiv.innerHTML = 'Öğrenciler yükleniyor...';

        const snap = await get(child(ref(db), 'ogrenciler'));
        listDiv.innerHTML = '';
        
        if(snap.exists()){
            snap.forEach(child => {
                const st = child.val();
                if(st.sinif == cl && st.sube == br){
                    const val = (st.notlar && st.notlar[uniqueKey]) ? st.notlar[uniqueKey].not : '';
                    listDiv.innerHTML += `<div class="student-row" data-no="${st.no}"><span>${st.no} - ${st.isim}</span><input type="number" class="grade-input" value="${val}" placeholder="0-100"></div>`;
                }
            });
        }
    };

    window.saveGrades = () => {
        const le = document.getElementById('t-lesson').value;
        const te = document.getElementById('t-term').value;
        const ty = document.getElementById('t-type').value;
        const uniqueKey = `${le}_${te}_${ty}`.replace(/ /g, '_');

        document.querySelectorAll('.student-row').forEach(row => {
            const no = row.getAttribute('data-no');
            const val = row.querySelector('.grade-input').value;
            const refPath = `ogrenciler/${no}/notlar/${uniqueKey}`;
            
            if(val !== '') {
                set(ref(db, refPath), { ders: le, donem: te, islem: ty, not: val });
            } else {
                remove(ref(db, refPath));
            }
        });
        alert("İşlem tamamlandı! Notlar kaydedildi.");
    };

    // --- VBS İŞLEMLERİ ---
    window.loginVBS = () => {
        const no = document.getElementById('vbs-no').value.trim();
        const pin = document.getElementById('vbs-kod').value.trim();
        get(child(ref(db), `ogrenciler/${no}`)).then((s) => {
            if (s.exists() && s.val().kod === pin) {
                window.show('vbs-panel');
                if(vbsListener) vbsListener(); // Varsa eski dinleyiciyi kapat
                
                // Anlık veri dinlemeyi başlat (Canlı Not Akışı)
                vbsListener = onValue(ref(db, `ogrenciler/${no}`), (snap) => {
                    const st = snap.val();
                    document.getElementById('vbs-student-name').innerText = `🎓 ${st.isim} (${st.no})`;
                    const gDiv = document.getElementById('vbs-grades'); 
                    gDiv.innerHTML = '';
                    
                    if(st.notlar) {
                        Object.values(st.notlar).forEach(g => {
                            gDiv.innerHTML += `<p><strong>[${g.donem}] ${g.ders} (${g.islem}):</strong> ${g.not}</p>`;
                        });
                    } else {
                        gDiv.innerHTML = "Sisteme girilmiş not bulunmuyor.";
                    }
                });
            } else {
                alert("Okul Numarası veya Özel Kod Hatalı!");
            }
        });
    };

    window.logoutVBS = () => {
        if(vbsListener) vbsListener(); // Firebase bağlantısını kes (Veri tasarrufu için)
        // VBS formunu temizle
        document.getElementById('vbs-no').value = '';
        document.getElementById('vbs-kod').value = '';
        document.getElementById('vbs-student-name').innerText = '';
        document.getElementById('vbs-grades').innerHTML = 'Yükleniyor...';
        window.show('main-menu');
    };
</script>
</body>
</html>
