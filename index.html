<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBS - Okul Yönetim Sistemi</title>
    <style>
        body { font-family: sans-serif; background: #e0f7fa; margin: 0; padding: 10px; color: #333; }
        .container { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
        h2 { color: #00796b; font-size: 1.2rem; margin-top: 0; border-bottom: 2px solid #b2dfdb; padding-bottom: 5px;}
        h3 { color: #004d40; font-size: 1rem; margin-bottom: 5px;}
        input, select { width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #b2dfdb; border-radius: 5px; box-sizing: border-box; background: #f1f8e9;}
        button { width: 100%; padding: 12px; background: #00796b; color: white; border: none; border-radius: 5px; font-weight: bold; margin-top: 5px; cursor: pointer;}
        .btn-red { background: #d32f2f; }
        .btn-blue { background: #1976d2; }
        .btn-orange { background: #e65100; }
        .hidden { display: none; }
        .flex-row { display: flex; gap: 5px; }
        .student-row { display: flex; justify-content: space-between; align-items: center; background: #e8f5e9; padding: 8px; margin-bottom: 5px; border-radius: 5px;}
        .student-row input { width: 80px; margin: 0; padding: 5px; text-align: center;}
        .info-box { background: #e3f2fd; padding: 10px; border-radius: 5px; margin-top: 5px; font-size: 0.9rem; border-left: 5px solid #1976d2; }
        hr { border: 1px solid #eee; margin: 15px 0; }
        .live-badge { background: #d50000; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; vertical-align: top; margin-left: 5px; animation: blink 1.5s infinite;}
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }
    </style>
</head>
<body>

<div id="main-menu" class="container">
    <h2>🌟 Sistem Girişi</h2>
    <button class="btn-blue" onclick="show('ybs-login')">⚙️ YBS Girişi</button>
    <button class="btn-blue" onclick="show('teacher-login')">👨‍🏫 Öğretmen Girişi</button>
    <button class="btn-blue" onclick="show('vbs-login')">👨‍👩‍👧 VBS Girişi</button>
</div>

<div id="ybs-login" class="container hidden">
    <h2>⚙️ YBS Giriş</h2>
    <input type="number" id="ybs-kurum" placeholder="Kurum Kodu (Giriş için: 76 yazın)">
    <input type="number" id="ybs-kod" placeholder="Kullanıcı Kodu">
    <input type="password" id="ybs-pass" placeholder="Şifre">
    <button onclick="loginYBS()">Giriş Yap ✔️</button>
    <button class="btn-red" onclick="show('main-menu')">Geri 🔙</button>
</div>

<div id="ybs-panel" class="container hidden">
    <h2>🛠️ YBS Yönetim Paneli</h2>
    <button class="btn-red" onclick="logoutYBS()">Çıkış Yap 🚪</button>
    <hr>
    
    <h3>👨‍🏫 Öğretmen Yönetimi</h3>
    <input type="text" id="ybs-t-user" placeholder="Öğretmen Kullanıcı Adı (Nokta, boşluk kullanmayın)">
    <input type="password" id="ybs-t-pass" placeholder="Öğretmen Giriş Şifresi">
    <button onclick="addTeacher()">Öğretmen Kaydet 💾</button>
    
    <hr>
    
    <h3>🎓 Öğrenci Yönetimi</h3>
    <select id="ybs-s-class"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select>
    <select id="ybs-s-branch"><option value="Gep-Up 1">Gep-Up 1</option><option value="Gep-Up 2">Gep-Up 2</option><option value="Gep-Up 3">Gep-Up 3</option></select>
    <input type="text" id="ybs-s-name" placeholder="Adı Soyadı">
    <input type="number" id="ybs-s-no" placeholder="Numara">
    <input type="text" id="ybs-s-pin" placeholder="Özel Kod (VBS için)">
    <button onclick="addStudent()">Öğrenci Kaydet 💾</button>
</div>

<div id="teacher-login" class="container hidden">
    <h2>👨‍🏫 Öğretmen Girişi</h2>
    <input type="text" id="teacher-user" placeholder="Kullanıcı Adı">
    <input type="password" id="teacher-pass" placeholder="Şifre">
    <button onclick="loginTeacher()">Giriş Yap ✔️</button>
    <button class="btn-red" onclick="show('main-menu')">Geri 🔙</button>
</div>

<div id="teacher-panel" class="container hidden">
    <h2>📝 Öğretmen Paneli</h2>
    
    <select id="t-mode" onchange="changeTeacherMode()" style="background-color: #fff3e0; border-color: #ff9800; font-weight: bold;">
        <option value="not">📝 Not Girişi Yap</option>
        <option value="devamsizlik">📅 Devamsızlık Girişi Yap</option>
    </select>
    
    <hr>

    <select id="t-class" onchange="filterStudents()">
        <option disabled selected value="">Sınıf Seç</option>
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option>
    </select>
    
    <select id="t-branch" onchange="filterStudents()">
        <option disabled selected value="">Şube Seç</option>
        <option value="Gep-Up 1">Gep-Up 1</option><option value="Gep-Up 2">Gep-Up 2</option><option value="Gep-Up 3">Gep-Up 3</option>
    </select>
    
    <div id="not-secimleri">
        <select id="t-lesson" onchange="filterStudents()">
            <option disabled selected value="">Ders Seç</option>
            <option value="Matematik">Matematik</option>
            <option value="Türkçe">Türkçe</option>
            <option value="İngilizce">İngilizce</option>
            <option value="Beden Eğitimi">Beden Eğitimi</option>
        </select>
        
        <select id="t-term" onchange="filterStudents()">
            <option disabled selected value="">Dönem Seç</option>
            <option value="1. Dönem">1. Dönem</option>
            <option value="2. Dönem">2. Dönem</option>
            <option value="3. Dönem">3. Dönem</option>
        </select>
        
        <select id="t-type" onchange="filterStudents()">
            <option disabled selected value="">Not Tipi Seç</option>
            <option value="Sınav">Sınav</option>
            <option value="Ders İçi Katılım">Ders İçi Katılım</option>
            <option value="Proje">Proje</option>
            <option value="Sözlü">Sözlü</option>
        </select>
    </div>
    
    <div id="teacher-student-list" style="margin-top:10px;"></div>
    <button class="btn-orange" onclick="saveData()">Tümünü Kaydet/Güncelle 💾</button>
    <button class="btn-red" onclick="logoutTeacher()">Güvenli Çıkış ❌</button>
</div>

<div id="vbs-login" class="container hidden">
    <h2>👨‍👩‍👧 VBS Girişi</h2>
    <input type="number" id="vbs-no" placeholder="Okul No">
    <input type="password" id="vbs-kod" placeholder="Özel Kod">
    <button onclick="loginVBS()">Giriş ✔️</button>
    <button class="btn-red" onclick="show('main-menu')">Geri 🔙</button>
</div>

<div id="vbs-panel" class="container hidden">
    <h2>📊 Veli Bilgilendirme <span class="live-badge">CANLI</span></h2>
    <div id="vbs-student-name" style="font-weight:bold; color:#004d40; margin-bottom:10px;"></div>
    
    <h3>📅 Devamsızlık Durumu</h3>
    <div id="vbs-attendance" style="background: #fff3e0; padding: 10px; border-radius: 5px; margin-bottom: 10px; color: #d84315; font-weight: bold;">
        Yükleniyor...
    </div>

    <h3>📝 Not Bilgileri</h3>
    <div id="vbs-grades" style="background: #e3f2fd; padding: 10px; border-radius: 5px; white-space: pre-line;">Yükleniyor...</div>
    
    <button class="btn-red" style="margin-top:15px;" onclick="logoutVBS()">Güvenli Çıkış 🚪</button>
</div>

<script type="module">

      projectId: "my-e-kurs-project"

    const db = getDatabase(initializeApp(firebaseConfig));

    // --- GENEL FONKSİYONLAR ---
    window.show = (id) => { 
        document.querySelectorAll('.container').forEach(e => e.classList.add('hidden')); 
        document.getElementById(id).classList.remove('hidden'); 
    };

    // --- YBS KODLARI ---
    window.loginYBS = () => { 
        if(document.getElementById('ybs-kurum').value == '76') {
            window.show('ybs-panel'); 
        } else {
            alert("Hatalı Giriş! Kurum kodunu 76 girin."); 
        }
    };

    window.logoutYBS = () => {
        document.getElementById('ybs-kurum').value = '';
        document.getElementById('ybs-kod').value = '';
        document.getElementById('ybs-pass').value = '';
        window.show('main-menu');
    };

    // HATA DÜZELTİLDİ: Öğretmen kayıt olurken Firebase'i çökerten karakterleri temizliyoruz.
    window.addTeacher = () => {
